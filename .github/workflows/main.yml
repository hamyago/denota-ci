name: DeNoTa CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Version Flutter + Dart
        run: flutter --version

      # ══════════════════════════════════════════════════════════
      # On crée un projet Flutter vierge, puis on y injecte :
      #   - lib/  (notre code)
      #   - test/ (nos tests)
      #   - pubspec.yaml
      #   - .env + assets
      # On NE COPIE PAS les fichiers Gradle/Kotlin : flutter create
      # génère la config parfaitement compatible avec le SDK du CI.
      # On patche ensuite minSdk, applicationId et permissions.
      # ══════════════════════════════════════════════════════════
      - name: 🏗️ Créer projet Flutter vierge
        run: flutter create --org ci.denota --project-name denota /tmp/denota_base

      - name: 📂 Injecter notre code source
        run: |
          rm -rf /tmp/denota_base/lib/ /tmp/denota_base/test/
          cp -r "$GITHUB_WORKSPACE/lib/"  /tmp/denota_base/lib/
          cp -r "$GITHUB_WORKSPACE/test/" /tmp/denota_base/test/
          cp "$GITHUB_WORKSPACE/pubspec.yaml"          /tmp/denota_base/pubspec.yaml
          cp "$GITHUB_WORKSPACE/analysis_options.yaml" /tmp/denota_base/analysis_options.yaml

      - name: 🔧 Patcher la config Android (minSdk + permissions)
        run: |
          APP_GRADLE="/tmp/denota_base/android/app/build.gradle.kts"
          MANIFEST="/tmp/denota_base/android/app/src/main/AndroidManifest.xml"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$APP_GRADLE"
          sed -i 's/android:label="denota"/android:label="DeNoTa"/' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"
          grep -n "minSdk" "$APP_GRADLE"
          grep "uses-permission" "$MANIFEST"

      - name: 🔐 Créer .env
        working-directory: /tmp/denota_base
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: 📁 Créer dossiers assets
        working-directory: /tmp/denota_base
        run: mkdir -p assets/images assets/icons assets/fonts

      - name: 🖼️ Copier les images (logo + icône)
        run: |
          cp "$GITHUB_WORKSPACE"/assets/images/*.png /tmp/denota_base/assets/images/ 2>/dev/null || echo "Pas de PNG à copier"
          ls -la /tmp/denota_base/assets/images/

      - name: 🔤 Télécharger fonts Poppins
        working-directory: /tmp/denota_base
        run: |
          BASE="https://github.com/google/fonts/raw/main/ofl/poppins"
          for font in Regular Medium SemiBold Bold Light; do
            curl -fL "$BASE/Poppins-$font.ttf" -o "assets/fonts/Poppins-$font.ttf"
          done

      - name: 🔥 Configurer Firebase (optionnel)
        working-directory: /tmp/denota_base
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: 📦 flutter pub get
        working-directory: /tmp/denota_base
        run: flutter pub get

      - name: 🎨 Générer les icônes de lancement
        working-directory: /tmp/denota_base
        run: dart run flutter_launcher_icons

      - name: 🔍 Analyser le code
        working-directory: /tmp/denota_base
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🏗️ Build APK Debug
        working-directory: /tmp/denota_base
        run: flutter build apk --debug --no-pub

      - name: 🔍 Localiser APK
        if: always()
        run: find /tmp/denota_base/build -name "*.apk" -type f 2>/dev/null | head -10 || echo "Pas d'APK"

      - name: 📤 Upload APK Debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-debug-${{ github.run_number }}
          path: /tmp/denota_base/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

  deploy-web:
    name: 🌐 Site Vitrine
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-web-vitrine
          path: web_vitrine/index.html
          retention-days: 30

  summary:
    name: 📊 Résumé
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always()
    steps:
      - run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Build  : #${{ github.run_number }}"
          echo "Status : ${{ needs.build-android.result }}"
