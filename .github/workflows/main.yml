name: DeNoTa CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Créer projet Flutter de base
        run: |
          flutter create --org ci.denota --project-name denota /tmp/denota_base
          echo "✅ Base Flutter créée"

      - name: 📋 Copier tout le code source
        run: |
          # Code Dart
          cp -r lib/         /tmp/denota_base/lib/
          # pubspec avec dependency_overrides
          cp pubspec.yaml    /tmp/denota_base/pubspec.yaml
          # Autres assets
          cp -r supabase/    /tmp/denota_base/supabase/    2>/dev/null || true
          cp -r web_vitrine/ /tmp/denota_base/web_vitrine/ 2>/dev/null || true
          echo "✅ Code copié"

      - name: 🔐 Créer .env
        working-directory: /tmp/denota_base
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: 📁 Créer dossiers assets
        working-directory: /tmp/denota_base
        run: mkdir -p assets/images assets/icons assets/fonts

      - name: 🔤 Télécharger fonts Poppins
        working-directory: /tmp/denota_base
        run: |
          BASE="https://github.com/google/fonts/raw/main/ofl/poppins"
          for font in Regular Medium SemiBold Bold Light; do
            curl -fL "$BASE/Poppins-$font.ttf" -o "assets/fonts/Poppins-$font.ttf"
          done
          echo "✅ Fonts OK"

      - name: 🔥 Configurer Firebase
        working-directory: /tmp/denota_base
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "$GITHUB_WORKSPACE/android/app/src/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/android/app/src/google-services.json" android/app/google-services.json
          fi

      - name: 🔧 Appliquer config Gradle corrigée
        run: |
          # build.gradle.kts avec compileSdk=35 fixe
          cp "$GITHUB_WORKSPACE/android/app/build.gradle.kts" \
             /tmp/denota_base/android/app/build.gradle.kts
          # gradle.properties avec SDK versions forcées
          cp "$GITHUB_WORKSPACE/android/gradle.properties" \
             /tmp/denota_base/android/gradle.properties
          # gradle wrapper compatible Flutter 3.24
          cp "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties" \
             /tmp/denota_base/android/gradle/wrapper/gradle-wrapper.properties
          echo "✅ Gradle config appliquée"

      - name: 📦 flutter pub get
        working-directory: /tmp/denota_base
        run: flutter pub get

      - name: 🔍 Analyser le code
        working-directory: /tmp/denota_base
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🏗️ Build APK Debug
        working-directory: /tmp/denota_base
        run: flutter build apk --debug --no-pub

      - name: 🔍 Localiser APK
        if: always()
        run: find /tmp/denota_base/build -name "*.apk" 2>/dev/null || echo "Pas d'APK"

      - name: 📤 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-debug-${{ github.run_number }}
          path: /tmp/denota_base/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: 🚀 Build APK Release
        if: github.ref == 'refs/heads/main'
        working-directory: /tmp/denota_base
        run: flutter build apk --release --no-pub

      - name: 📤 Upload APK Release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-release-${{ github.run_number }}
          path: /tmp/denota_base/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  deploy-web:
    name: 🌐 Site Vitrine
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-web-vitrine
          path: web_vitrine/index.html
          retention-days: 30

  summary:
    name: 📊 Résumé
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always()
    steps:
      - run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Build  : #${{ github.run_number }}"
          echo "Status : ${{ needs.build-android.result }}"
