name: DeNoTa CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Version Flutter + Dart
        run: flutter --version

      - name: 🏗️ Créer projet Flutter ET écraser lib/ immédiatement
        run: |
          # Créer le projet de base
          flutter create --org ci.denota --project-name denota /tmp/denota_base
          
          # Écraser IMMÉDIATEMENT le lib/ généré par flutter create
          rm -rf /tmp/denota_base/lib/
          cp -r "$GITHUB_WORKSPACE/lib/" /tmp/denota_base/lib/
          
          # Vérifier que notre main.dart est bien là
          echo "=== Notre main.dart (wc -l) ==="
          wc -l /tmp/denota_base/lib/main.dart
          echo "=== Ligne 30-35 ==="
          sed -n '30,35p' /tmp/denota_base/lib/main.dart
          
          # Vérifier qu'il n'y a plus de dot-shorthands
          if grep -rn ": \.[a-z]" /tmp/denota_base/lib/; then
            echo "⚠️ dot-shorthands encore présents !"
          else
            echo "✅ Pas de dot-shorthands — lib/ propre"
          fi

      - name: 🔧 Appliquer config Gradle
        run: |
          cp "$GITHUB_WORKSPACE/android/app/build.gradle.kts"                     /tmp/denota_base/android/app/build.gradle.kts
          cp "$GITHUB_WORKSPACE/android/build.gradle.kts"                          /tmp/denota_base/android/build.gradle.kts
          cp "$GITHUB_WORKSPACE/android/settings.gradle.kts"                       /tmp/denota_base/android/settings.gradle.kts
          cp "$GITHUB_WORKSPACE/android/gradle.properties"                         /tmp/denota_base/android/gradle.properties
          cp "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties"  /tmp/denota_base/android/gradle/wrapper/gradle-wrapper.properties
          # ⚠️ Indispensable : sans ce manifest l'APK perd les permissions
          # (INTERNET, CAMERA, LOCATION…) et le nom "DeNoTa"
          cp "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml"          /tmp/denota_base/android/app/src/main/AndroidManifest.xml

      - name: 📋 Copier pubspec + assets + test
        run: |
          cp "$GITHUB_WORKSPACE/pubspec.yaml"           /tmp/denota_base/pubspec.yaml
          cp "$GITHUB_WORKSPACE/analysis_options.yaml"  /tmp/denota_base/analysis_options.yaml
          
          # Écraser le test/ généré par flutter create (référence MyApp)
          rm -rf /tmp/denota_base/test/
          cp -r "$GITHUB_WORKSPACE/test/" /tmp/denota_base/test/
          
          # Copier les ressources Android (styles, drawable, manifests debug/profile)
          cp -r "$GITHUB_WORKSPACE/android/app/src/main/res/"     /tmp/denota_base/android/app/src/main/res/
          cp "$GITHUB_WORKSPACE/android/app/src/debug/AndroidManifest.xml"   /tmp/denota_base/android/app/src/debug/AndroidManifest.xml
          cp "$GITHUB_WORKSPACE/android/app/src/profile/AndroidManifest.xml" /tmp/denota_base/android/app/src/profile/AndroidManifest.xml
          
          # Copier MainActivity.kt
          mkdir -p /tmp/denota_base/android/app/src/main/kotlin/ci/denota/denota/
          cp "$GITHUB_WORKSPACE/android/app/src/main/kotlin/ci/denota/denota/MainActivity.kt" \
             /tmp/denota_base/android/app/src/main/kotlin/ci/denota/denota/MainActivity.kt
          
          cp -r "$GITHUB_WORKSPACE/supabase/"    /tmp/denota_base/supabase/    2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/web_vitrine/" /tmp/denota_base/web_vitrine/ 2>/dev/null || true

      - name: 🔐 Créer .env
        working-directory: /tmp/denota_base
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: 📁 Créer dossiers assets
        working-directory: /tmp/denota_base
        run: mkdir -p assets/images assets/icons assets/fonts

      - name: 🔤 Télécharger fonts Poppins
        working-directory: /tmp/denota_base
        run: |
          BASE="https://github.com/google/fonts/raw/main/ofl/poppins"
          for font in Regular Medium SemiBold Bold Light; do
            curl -fL "$BASE/Poppins-$font.ttf" -o "assets/fonts/Poppins-$font.ttf"
          done

      - name: 🔥 Configurer Firebase
        working-directory: /tmp/denota_base
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "$GITHUB_WORKSPACE/android/app/src/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/android/app/src/google-services.json" android/app/google-services.json
          fi

      - name: 📦 flutter pub get
        working-directory: /tmp/denota_base
        run: flutter pub get

      - name: 📊 Vérifier les versions des plugins
        working-directory: /tmp/denota_base
        run: flutter pub outdated || true

      - name: 🔍 Analyser le code
        working-directory: /tmp/denota_base
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🏗️ Build APK Debug
        working-directory: /tmp/denota_base
        run: flutter build apk --debug --no-pub --android-skip-build-dependency-validation

      - name: 🔍 Localiser APK
        if: always()
        run: find /tmp/denota_base/build -name "*.apk" -type f 2>/dev/null | head -10 || echo "Pas d'APK"

      - name: 📤 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-debug-${{ github.run_number }}
          path: /tmp/denota_base/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # ⚠️ Build Release désactivé — nécessite un keystore de signature.
      # Pour l'activer :
      # 1. Générer un keystore : keytool -genkey -v -keystore denota-release.keystore ...
      # 2. Ajouter les secrets GitHub : KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
      # 3. Décommenter les étapes ci-dessous
      #
      # - name: 🚀 Build APK Release
      #   if: github.ref == 'refs/heads/main'
      #   working-directory: /tmp/denota_base
      #   run: flutter build apk --release --no-pub
      #
      # - name: 📤 Upload APK Release
      #   if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: DeNoTa-release-${{ github.run_number }}
      #     path: /tmp/denota_base/build/app/outputs/flutter-apk/app-release.apk
      #     retention-days: 30

  deploy-web:
    name: 🌐 Site Vitrine
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-web-vitrine
          path: web_vitrine/index.html
          retention-days: 30

  summary:
    name: 📊 Résumé
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always()
    steps:
      - run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Build  : #${{ github.run_number }}"
          echo "Status : ${{ needs.build-android.result }}"
