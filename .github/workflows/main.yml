name: DeNoTa CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🔐 Créer .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: 📁 Créer dossiers assets
        run: mkdir -p assets/images assets/icons assets/fonts

      - name: 🔤 Télécharger fonts Poppins
        run: |
          BASE="https://github.com/google/fonts/raw/main/ofl/poppins"
          curl -fL "$BASE/Poppins-Regular.ttf"   -o assets/fonts/Poppins-Regular.ttf
          curl -fL "$BASE/Poppins-Medium.ttf"    -o assets/fonts/Poppins-Medium.ttf
          curl -fL "$BASE/Poppins-SemiBold.ttf"  -o assets/fonts/Poppins-SemiBold.ttf
          curl -fL "$BASE/Poppins-Bold.ttf"      -o assets/fonts/Poppins-Bold.ttf
          curl -fL "$BASE/Poppins-Light.ttf"     -o assets/fonts/Poppins-Light.ttf
          ls -la assets/fonts/

      - name: 🔥 Configurer Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json depuis secret"
          elif [ -f "android/app/src/google-services.json" ]; then
            cp android/app/src/google-services.json android/app/google-services.json
            echo "✅ google-services.json copié depuis src/"
          else
            echo "⚠️ Aucun google-services.json trouvé"
          fi

      - name: 📦 flutter pub get
        run: flutter pub get

      - name: 🔍 Analyser le code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🏗️ Build APK Debug
        run: flutter build apk --debug --no-pub

      - name: 📤 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-debug-${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: 🚀 Build APK Release
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --no-pub

      - name: 📤 Upload APK Release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-release-${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  deploy-web:
    name: 🌐 Site Vitrine
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: DeNoTa-web-vitrine
          path: web_vitrine/index.html
          retention-days: 30

  summary:
    name: 📊 Résumé
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always()
    steps:
      - run: |
          echo "=============================="
          echo "  DeNoTa Build #${{ github.run_number }}"
          echo "=============================="
          echo "Branch  : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Status  : ${{ needs.build-android.result }}"
          echo "=============================="
