name: denota
description: DeNoTa — Détection de Nouveaux Talents Sportifs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

# ─────────────────────────────────────────────────────────────
# Dépendances mises à jour (juillet 2026) et réduites au strict
# nécessaire : chaque plugin retiré était déclaré mais jamais
# importé dans lib/ (source majeure d'incompatibilités de build).
# Réactivez-les au moment où la fonctionnalité arrive.
# ─────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────
  supabase_flutter: ^2.15.0

  # ── State Management (prévu pour la migration BLoC) ──
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # ── UI ────────────────────────────────────
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  animate_do: ^4.2.0

  # ── Media ─────────────────────────────────
  video_player: ^2.9.2
  chewie: ^1.10.0
  image_picker: ^1.1.2

  # ── Carte ─────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── Storage local ─────────────────────────
  shared_preferences: ^2.5.0

  # ── Utils ─────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  dio: ^5.8.0
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1

  # ── Firebase (push notifications) ─────────
  firebase_core: ^4.9.0
  firebase_messaging: ^16.0.0

  # ── PDF (rapports de scouting) ────────────
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ── Configuration des icônes de lancement ────────────────────
# Génère les icônes Android (adaptatives) et iOS à partir de
# assets/images/. Lancer : flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#1B5E3B"
  adaptive_icon_background: "#1B5E3B"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
