name: denota
description: DeNoTa — Détection de Nouveaux Talents Sportifs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────
  supabase_flutter: ^2.5.0

  # ── State Management ──────────────────────
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Navigation (version stable sans conflits) ──
  go_router: ^12.1.3

  # ── UI ────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  animate_do: ^3.3.4
  iconsax: ^0.0.8
  badges: ^3.1.2

  # ── Media ─────────────────────────────────
  video_player: ^2.8.3
  chewie: ^1.8.1
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  file_picker: ^8.0.0+1
  photo_view: ^0.14.0

  # ── Storage local ─────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # ── Utils ─────────────────────────────────
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.4.0
  dio: ^5.4.3
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0
  logger: ^2.3.0

  # ── Firebase ──────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── Maps ──────────────────────────────────
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # ── PDF ───────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1

dependency_overrides:
  # Forcer app_links à une version compatible avec compileSdk 35
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
