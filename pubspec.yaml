name: denota
description: DeNoTa — Détection de Nouveaux Talents Sportifs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────
  supabase_flutter: ^2.8.0

  # ── State Management ──────────────────────
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # ── UI ────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  animate_do: ^3.3.4
  iconsax: ^0.0.8
  badges: ^3.1.2

  # ── Media ─────────────────────────────────
  video_player: ^2.9.2
  chewie: ^1.10.0
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  file_picker: ^8.1.7
  photo_view: ^0.15.0

  # ── Storage local ─────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # ── Utils ─────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0

  # ── Firebase ──────────────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # ── Maps ──────────────────────────────────
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2

  # ── PDF ───────────────────────────────────
  pdf: ^3.11.3
  printing: ^5.14.2

  # ── app_links forcé à la dernière version ──
dependency_overrides:
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
